# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard > New + > Blueprint > pick this repo > Apply.
# Provisions a free PostgreSQL and a free Docker web service, wired together.

databases:
  - name: locationtracker-db
    plan: free
    region: singapore
    databaseName: locationtracker
    user: locationtracker

services:
  - type: web
    name: locationtracker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: locationtracker-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
