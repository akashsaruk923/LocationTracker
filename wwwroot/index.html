<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Location Check-in</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: #1e293b; border: 1px solid #334155;
    border-radius: 16px; padding: 28px; text-align: center;
    box-shadow: 0 20px 45px -20px rgba(0,0,0,.6);
  }
  h1 { margin: 0 0 6px; font-size: 1.35rem; }
  p.sub { margin: 0 0 22px; color: #94a3b8; font-size: .95rem; }
  button {
    width: 100%; padding: 13px 18px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 10px; cursor: pointer;
    background: #38bdf8; color: #082f49; transition: opacity .15s;
  }
  button:disabled { opacity: .55; cursor: default; }
  .status {
    margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-size: .9rem;
    display: none; white-space: pre-wrap; word-break: break-word;
  }
  .status.show { display: block; }
  .status.ok { background: #052e1b; color: #86efac; border: 1px solid #14532d; }
  .status.err { background: #3f1d1d; color: #fca5a5; border: 1px solid #7f1d1d; }
  .status.info { background: #0c2740; color: #7dd3fc; border: 1px solid #155e75; }
  .coords { margin-top: 14px; font-size: .85rem; color: #cbd5e1; }
  .coords span { color: #f8fafc; font-weight: 600; }
  .coords a { color: #7dd3fc; }
  footer { margin-top: 20px; font-size: .75rem; color: #64748b; }
</style>
</head>
<body>
  <main class="card">
    <h1>📍 Location Check-in</h1>
    <p class="sub">Checking you in…</p>
    <button id="shareBtn" hidden>Allow precise location</button>
    <div id="status" class="status"></div>
    <div id="coords" class="coords"></div>
    <footer>Precise location is read only if you allow the browser prompt. Best accuracy comes from a phone with GPS, outdoors.</footer>
  </main>

<script>
(function () {
  const btn = document.getElementById('shareBtn');
  const statusEl = document.getElementById('status');
  const coordsEl = document.getElementById('coords');

  const CLIENT_KEY = 'location-tracker-client-id';
  function clientId() {
    let id = null;
    try { id = localStorage.getItem(CLIENT_KEY); } catch (_) {}
    if (!id) {
      id = (crypto.randomUUID && crypto.randomUUID()) ||
           (Date.now().toString(36) + Math.random().toString(36).slice(2));
      try { localStorage.setItem(CLIENT_KEY, id); } catch (_) {}
    }
    return id;
  }

  function setStatus(kind, msg) {
    statusEl.className = 'status show ' + kind;
    statusEl.textContent = msg;
  }

  function post(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  // 1. The moment the page loads: record an approximate location from the IP.
  async function recordVisit() {
    try {
      const res = await post('/api/visit', { clientId: clientId() });
      if (!res.ok) return;
      const data = await res.json();
      const place = [data.city, data.country].filter(Boolean).join(', ');
      setStatus('info', 'ℹ️ Approx. area from network' + (place ? ': ' + place : '') +
        '. Getting a precise fix…');
    } catch (_) { /* best effort */ }
  }

  // 2. Precise location. A single reading is often a coarse cell/wifi fix, so we
  //    watch for a few seconds and keep the most accurate reading before saving.
  const GOOD_ENOUGH_M = 25;   // stop early once this accurate
  const MAX_WATCH_MS = 20000; // otherwise give up after this long
  let watchId = null, best = null, watchTimer = null, sent = false;

  function renderCoords(c, saving) {
    const gmaps = 'https://www.google.com/maps?q=' + c.latitude + ',' + c.longitude;
    coordsEl.innerHTML =
      'Latitude: <span>' + c.latitude.toFixed(6) + '</span> &nbsp; ' +
      'Longitude: <span>' + c.longitude.toFixed(6) + '</span><br>' +
      'Accuracy: <span>±' + Math.round(c.accuracy) + ' m</span>' +
      (saving ? '' : ' <span style="color:#94a3b8">(refining…)</span>') + '<br>' +
      '<a href="' + gmaps + '" target="_blank" rel="noopener">Open in Google Maps</a>';
  }

  function stopWatch() {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (watchTimer) { clearTimeout(watchTimer); watchTimer = null; }
  }

  function onReading(pos) {
    const c = pos.coords;
    if (!best || c.accuracy < best.coords.accuracy) best = pos;
    renderCoords(best.coords, false);
    setStatus('info', '📡 Refining location… best so far ±' + Math.round(best.coords.accuracy) + ' m');
    if (c.accuracy <= GOOD_ENOUGH_M) finish();
  }

  async function finish() {
    if (sent) return;
    sent = true;
    stopWatch();
    if (!best) { showRetry(); return; }
    const c = best.coords;
    renderCoords(c, true);
    setStatus('info', 'Saving precise location (±' + Math.round(c.accuracy) + ' m)…');
    try {
      const res = await post('/api/locations', {
        clientId: clientId(),
        latitude: c.latitude,
        longitude: c.longitude,
        accuracyMeters: c.accuracy ?? null,
        altitudeMeters: c.altitude ?? null,
        altitudeAccuracyMeters: c.altitudeAccuracy ?? null,
        heading: (c.heading != null && !Number.isNaN(c.heading)) ? c.heading : null,
        speedMetersPerSecond: (c.speed != null && !Number.isNaN(c.speed)) ? c.speed : null,
        deviceTimestampMs: best.timestamp ?? null
      });
      if (!res.ok) throw new Error('Server responded ' + res.status);
      setStatus(c.accuracy <= 100 ? 'ok' : 'info',
        (c.accuracy <= 100 ? '✅ Precise location saved' : '✅ Saved, but accuracy is only ±' +
          Math.round(c.accuracy) + ' m — a phone with GPS outdoors gives the best fix') + '.');
      btn.hidden = true;
    } catch (e) {
      setStatus('err', '❌ Could not save precise location.\n' + e.message);
      sent = false;
      showRetry();
    }
  }

  function onGeoError(err) {
    stopWatch();
    const map = {
      1: 'Precise location was blocked. Your approximate area is still recorded.',
      2: 'Precise location is unavailable right now.',
      3: 'Timed out getting precise location.'
    };
    setStatus(err.code === 1 ? 'info' : 'err', (err.code === 1 ? 'ℹ️ ' : '❌ ') + (map[err.code] || err.message));
    if (err.code !== 1 && best) finish();
    else if (err.code !== 1) showRetry();
  }

  function showRetry() {
    btn.hidden = false;
    btn.disabled = false;
    btn.textContent = 'Try precise location again';
  }

  function askPrecise() {
    if (!('geolocation' in navigator)) return;
    btn.disabled = true;
    stopWatch();
    best = null; sent = false;
    watchId = navigator.geolocation.watchPosition(onReading, onGeoError, {
      enableHighAccuracy: true, timeout: MAX_WATCH_MS, maximumAge: 0
    });
    watchTimer = setTimeout(finish, MAX_WATCH_MS);
  }

  btn.addEventListener('click', askPrecise);

  recordVisit();
  askPrecise();
})();
</script>
</body>
</html>
